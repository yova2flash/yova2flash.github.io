<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);
var msgs = document.getElementById("msgs");
var cacheInfo = document.getElementById("cache-info");
var notifyShown = false;

function showCustomNotification() {
  if (notifyShown) return;
  notifyShown = true;
  var n = document.getElementById("ps-notify");
  if (!n) return;
  n.style.display = "flex";
  setTimeout(function () {
    n.style.transition = "opacity 0.8s ease, transform 0.8s ease";
    n.style.opacity = "0";
    n.style.transform = "translateY(-20px)";
    setTimeout(function () { try { n.remove(); } catch (e) {} }, 800);
  }, 7000);
}
window.showCustomNotification = showCustomNotification;
window.jailbreakSuccess = showCustomNotification;

// Watch #msgs so 5.05 / 7.00 / 9.00 / 10.00-11.02 / 11.50-14.02 all trigger notification on GoldHEN load
if (typeof MutationObserver !== "undefined" && msgs) {
  new MutationObserver(function () {
    var t = msgs.textContent || "";
    if (/Loaded|Already Loaded/i.test(t)) showCustomNotification();
  }).observe(msgs, { childList: true, characterData: true, subtree: true });
}

function onScriptError() {
  msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

function cachePageForFw(fn) {
  if (fn == 5.05 || fn == 5.07) return "cache505.html";
  if (fn >= 7.00 && fn <= 8.52) return "cache700.html";
  if (fn >= 9.00 && fn <= 9.60) return "cache900.html";
  if (fn >= 10.00 && fn <= 11.02) return "cachecss.html";
  if (fn >= 11.50 && fn <= 14.02) return "cacheslopkit.html";
  return null;
}

function executeForFw(fn) {
  if (fn == 5.05 || fn == 5.07) {
    msgs.innerHTML = "Loading GoldHEN v2.4b18.14 (5.05 / 5.07)... Please Wait";
    var script = document.createElement("script");
    script.src = "505/exploit.js";
    script.onerror = onScriptError;
    document.head.appendChild(script);
  } else if (fn >= 7.00 && fn <= 8.52) {
    msgs.innerHTML = "Loading GoldHEN v2.4b18.14 (7.00 - 8.52)... Please Wait";
    var script = document.createElement("script");
    script.type = "module";
    script.src = "700/alert.js";
    script.onerror = onScriptError;
    document.head.appendChild(script);
  } else if (fn >= 9.00 && fn <= 9.60) {
    msgs.innerHTML = "Loading GoldHEN v2.4b18.14 (9.00 - 9.60)... Please Wait";
    var script = document.createElement("script");
    script.type = "module";
    script.src = "900/alert.js";
    script.onerror = onScriptError;
    document.head.appendChild(script);
  } else if (fn >= 10.00 && fn <= 11.02) {
    msgs.innerHTML = "Loading GoldHEN v2.4b18.14 (10.00 - 11.02)... Please Wait";
    var script = document.createElement("script");
    script.src = "css/main.js";
    script.onerror = onScriptError;
    script.onload = function () {
      setTimeout(function () { if (typeof doJb === "function") doJb(); }, 500);
    };
    document.head.appendChild(script);
  } else if (fn == 11.50 || fn == 11.52) {
    msgs.innerHTML = "Loading GoldHEN v2.4b18.14 (11.50 - 11.52)... Please Wait";
    var script = document.createElement("script");
    script.type = "module";
    script.src = "slopkit/chain_lapse.js";
    script.onerror = onScriptError;
    document.head.appendChild(script);
  } else if (fn >= 12.00 && fn <= 14.02) {
    msgs.innerHTML = "Loading GoldHEN v2.4b18.14 (" + (fn >= 14.02 ? "14.02" : fn >= 14.00 ? "14.00" : "12.00-13.52") + ")... Please Wait";
    var script = document.createElement("script");
    script.type = "module";
    script.src = "slopkit/jb.js";
    script.onerror = onScriptError;
    document.head.appendChild(script);
  } else {
    msgs.innerHTML = 'Unsupported Firmware: <span style="color: #ff4d4d;">' + fwVersion + '</span>';
  }
}

function autoLaunch() {
  if (isPS4 && !isNaN(fwNum)) {
    executeForFw(fwNum);
  } else {
    msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.02";
  }
}

function launchPayload(fwStr) {
  var n = parseFloat(fwStr);
  if (n >= 100) n = n / 100;
  executeForFw(n);
}

function installCacheForFw() {
  var cp = cachePageForFw(fwNum);
  if (!cp) cp = "cacheslopkit.html";
  window.location.replace(cp);
}

if (!isPS4) {
  document.addEventListener("DOMContentLoaded", function () {
    msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.02";
    if (cacheInfo) cacheInfo.textContent = "Detected User-Agent: non-PS4 browser (select a button to test)";
  });
} else {
  var ac = window.applicationCache;
  if (ac && ac.status == 0) {
    var cp = cachePageForFw(fwNum);
    if (cp) {
      window.location.replace(cp);
    } else {
      document.addEventListener("DOMContentLoaded", function () {
        msgs.innerHTML = 'Unsupported Firmware: <span style="color: #ff4d4d;">' + fwVersion + '</span>';
      });
    }
  } else {
    if (ac) {
      ac.addEventListener("updateready", function () {
        try { ac.swapCache(); } catch (e) {}
        if (cacheInfo) cacheInfo.textContent = "Cache updated -- reopen browser on next boot";
      }, false);
      if (cacheInfo) cacheInfo.textContent = navigator.onLine ? "Offline Cache Ready (PS4 " + fwVersion + ")" : "Running Offline from Cache (PS4 " + fwVersion + ")";
    }
    document.addEventListener("DOMContentLoaded", function () {
      executeForFw(fwNum);
    });
  }
}
</script>

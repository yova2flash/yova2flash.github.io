<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
  var percent = Math.round(e.loaded / e.total * 100);
  window.msgs.innerHTML = "Installing Offline Cache (5.05 / 5.07): " + percent + "%";
}

function DisplayCacheProgress() {
  window.msgs.innerHTML = "Cache Installed Successfully ✔";
  setTimeout(function () {
    window.msgs.innerHTML = "Now Close And Re-Open Your Browser ...";
  }, 1500);
}

if (window.applicationCache) {
  window.applicationCache.addEventListener("progress", DLProgress, false);
  window.applicationCache.oncached = function (e) { DisplayCacheProgress(); };
  window.applicationCache.onupdateready = function (e) {
    try { window.applicationCache.swapCache(); } catch (err) {}
    DisplayCacheProgress();
  };
  window.applicationCache.onerror = function (e) {
    window.msgs.innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
  };
} else {
  document.addEventListener("DOMContentLoaded", function () {
    window.msgs.innerHTML = "Offline Cache Unavailable in this Browser";
  });
}
</script>
